# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Install dependencies so Snyk can resolve them
      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install frontend dependencies
        run: npm install --ignore-scripts --legacy-peer-deps
        working-directory: frontend

      - name: Snyk
        uses: snyk/actions@0.3.0
        env:
        # don't forget to add your snyk token!
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --all-projects
          
      - name: Snyk test
        uses: snyk/actions@0.3.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --all-projects
    # Output a snyk.json file with results if running the test command
          json: snyk_results.json

# Running a Snyk Code test
  code-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Snyk Code test
        run: npx snyk@latest code test --report --project-name="snyk-juice-shop-cli" --target-name="snyk-juice-shop" --target-reference="main"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

